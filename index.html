<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rojak AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0c0c;--panel:#101111;--panel2:#151616;--border:#292b2b;--text:#f1f1f1;--muted:#858989;--orange:#ff6500}
html,body{width:100%;height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,textarea{font:inherit}
.app{height:100vh;display:flex}
.sidebar{width:250px;height:100%;background:#0f1010;border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.brand-icon{width:36px;height:36px;background:var(--orange);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.brand-title{font-size:14px;font-weight:700}.brand-subtitle{font-size:11px;color:var(--muted);margin-top:2px}
.new-chat{width:100%;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:9px;padding:11px 12px;font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.new-chat:hover{background:var(--panel2)}
.history-title{margin:22px 0 9px;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.history{flex:1;overflow-y:auto}.history::-webkit-scrollbar{width:4px}.history::-webkit-scrollbar-thumb{background:#303232;border-radius:10px}
.history-item{width:100%;padding:9px 10px;border-radius:7px;color:#cfd1d1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.history-item:hover{background:#171818}
.sidebar-footer{border-top:1px solid var(--border);padding-top:12px;color:#666969;font-size:10px;line-height:1.5}
.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column}
.topbar{height:58px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex-shrink:0}
.top-title{font-size:13px;font-weight:600}.status{display:flex;align-items:center;gap:7px;font-size:11px;color:#8f9393}.dot{width:7px;height:7px;border-radius:50%;background:#43c76b}
.chat{flex:1;overflow-y:auto;padding:34px 20px 120px}
.chat-inner{max-width:820px;margin:auto}
.welcome{padding:55px 0 25px;text-align:center}
.welcome h1{font-size:30px;letter-spacing:-.03em}.welcome p{margin-top:9px;color:var(--muted);font-size:13px}
.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:25px auto;max-width:650px}
.suggestion{background:#111313;border:1px solid var(--border);color:#d8dada;padding:13px;text-align:left;border-radius:9px;font-size:12px;cursor:pointer}
.suggestion:hover{border-color:#3a3c3c;background:#151717}
.message{display:flex;margin:0 0 25px;gap:12px}.message.user{justify-content:flex-end}
.avatar{width:29px;height:29px;border-radius:8px;background:#202222;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.message.user .avatar{background:var(--orange)}
.bubble{max-width:760px;font-size:13px;line-height:1.65}
.message.user .bubble{background:#171919;border:1px solid var(--border);border-radius:12px;padding:10px 13px;line-height:1.5}
.bubble p{margin:0 0 12px}.bubble p:last-child{margin-bottom:0}
.bubble h1{font-size:20px;margin:5px 0 13px}.bubble h2{font-size:17px;margin:18px 0 10px}.bubble h3{font-size:15px;margin:16px 0 8px}
.bubble ul,.bubble ol{margin:7px 0 14px;padding-left:25px}.bubble li{margin:5px 0;padding-left:2px}
.bubble blockquote{border-left:2px solid #555;padding-left:12px;color:#b9bcbc;margin:12px 0}
.bubble hr{border:0;border-top:1px solid var(--border);margin:18px 0}
.inline-code{background:#191b1b;border:1px solid #292c2c;padding:2px 5px;border-radius:5px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em}
.code-wrapper{margin:13px 0;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:#0a0b0b}
.code-header{height:34px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:#111313}
.code-language{font-size:10px;color:#858989}.copy-code{background:transparent;border:0;color:#999;cursor:pointer;font-size:10px}.copy-code:hover{color:#fff}
pre{padding:13px;overflow:auto;white-space:pre-wrap;word-break:break-word}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.6}
.table-wrap{overflow-x:auto;margin:12px 0}.bubble table{border-collapse:collapse;width:100%;font-size:12px}.bubble th,.bubble td{border:1px solid var(--border);padding:8px;text-align:left}.bubble th{background:#151717}
.composer-wrap{position:absolute;left:250px;right:0;bottom:0;padding:16px 20px 18px;background:linear-gradient(to top,#0b0c0c 72%,transparent)}
.composer{max-width:820px;margin:auto;display:flex;align-items:flex-end;gap:8px;background:#111313;border:1px solid var(--border);border-radius:12px;padding:8px}
#input{flex:1;resize:none;min-height:42px;max-height:150px;background:transparent;border:0;outline:0;color:var(--text);padding:10px 9px;font-size:13px;line-height:1.5}
#input::placeholder{color:#666969}
.send{width:38px;height:38px;border:0;border-radius:8px;background:var(--orange);color:white;font-weight:700;cursor:pointer}.send:hover{filter:brightness(1.08)}.send:disabled{opacity:.45;cursor:not-allowed}
.mobile-menu{display:none;background:none;border:0;color:#ddd;font-size:20px;cursor:pointer}
@media(max-width:720px){
.sidebar{position:fixed;z-index:10;left:-270px;transition:.2s;width:250px;box-shadow:15px 0 40px #0008}.sidebar.open{left:0}
.mobile-menu{display:block}.topbar{padding:0 15px}.top-title{font-size:12px}.chat{padding:20px 14px 120px}.welcome{padding:40px 0 20px}.welcome h1{font-size:25px}.suggestions{grid-template-columns:1fr}.composer-wrap{left:0;padding:12px}.bubble{font-size:13px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="brand"><div class="brand-icon">RA</div><div><div class="brand-title">Rojak AI</div><div class="brand-subtitle">Asisten Rojak DriveK1t</div></div></div>
<button class="new-chat" id="newChat">+ Chat baru</button>
<div class="history-title">Riwayat</div>
<div class="history" id="history"></div>
<div class="sidebar-footer">Rojak AI dibuat untuk membantu penggunaan Rojak DriveK1t dan pekerjaan Excel.</div>
</aside>
<main class="main">
<header class="topbar">
<div style="display:flex;align-items:center;gap:10px"><button class="mobile-menu" id="mobileMenu">☰</button><div class="top-title">Rojak AI · DriveK1t Assistant</div></div>
<div class="status"><span class="dot"></span> Online</div>
</header>
<section class="chat" id="chat"><div class="chat-inner" id="chatInner"></div></section>
<div class="composer-wrap">
<form class="composer" id="form">
<textarea id="input" rows="1" placeholder="Tulis pertanyaan tentang Rojak DriveK1t atau Excel..."></textarea>
<button class="send" id="send" type="submit">↑</button>
</form>
</div>
</main>
</div>

<script>
const chatInner=document.getElementById("chatInner");
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const form=document.getElementById("form");
const send=document.getElementById("send");
const historyEl=document.getElementById("history");
const sidebar=document.getElementById("sidebar");

let messages=[];
let chatHistory=JSON.parse(localStorage.getItem("rojak_ai_history")||"[]");

function cleanAIText(text){
return String(text||"")
.replace(/[\\u{1F300}-\\u{1FAFF}]/gu,"")
.replace(/[\\u{2600}-\\u{27BF}]/gu,"")
.replace(/[\\u200B-\\u200D\\uFEFF]/g,"");
}
function escapeHTML(text){
return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function parseInline(text){
let s=escapeHTML(text);
s=s.replace(/`([^`]+)`/g,'<span class="inline-code">$1</span>');
s=s.replace(/\\*\\*([^*]+)\\*\\*/g,"<strong>$1</strong>");
s=s.replace(/__([^_]+)__/g,"<strong>$1</strong>");
s=s.replace(/\\*([^*]+)\\*/g,"<em>$1</em>");
return s;
}

function renderMarkdown(rawText){
const text=cleanAIText(rawText);
const lines=text.split("\\n");
let html="",paragraph=[],inUL=false,inOL=false,inCode=false,codeLanguage="",codeLines=[];
function closeParagraph(){
if(!paragraph.length)return;
const content=paragraph.join(" ").trim();
if(content)html+="<p>"+parseInline(content)+"</p>";
paragraph=[];
}
function closeLists(){
if(inUL){html+="</ul>";inUL=false}
if(inOL){html+="</ol>";inOL=false}
}
function closeCode(){
if(!inCode)return;
const raw=codeLines.join("\\n");
html+=`<div class="code-wrapper"><div class="code-header"><span class="code-language">${escapeHTML(codeLanguage||"code")}</span><button class="copy-code" data-code="${escapeHTML(raw)}">Copy</button></div><pre><code>${escapeHTML(raw)}</code></pre></div>`;
inCode=false;codeLanguage="";codeLines=[];
}
for(let i=0;i<lines.length;i++){
const line=lines[i];
if(line.trim().startsWith("```")){
if(!inCode){closeParagraph();closeLists();inCode=true;codeLanguage=line.trim().substring(3).trim()}
else closeCode();
continue;
}
if(inCode){codeLines.push(line);continue}
if(!line.trim()){closeParagraph();continue}
if(line.trim()==="---"||line.trim()==="***"){closeParagraph();closeLists();html+="<hr>";continue}
if(/^### /.test(line)){closeParagraph();closeLists();html+="<h3>"+parseInline(line.substring(4))+"</h3>";continue}
if(/^## /.test(line)){closeParagraph();closeLists();html+="<h2>"+parseInline(line.substring(3))+"</h2>";continue}
if(/^# /.test(line)){closeParagraph();closeLists();html+="<h1>"+parseInline(line.substring(2))+"</h1>";continue}
if(/^[-*•]\\s+/.test(line)){
closeParagraph();
if(inOL){html+="</ol>";inOL=false}
if(!inUL){html+="<ul>";inUL=true}
html+="<li>"+parseInline(line.replace(/^[-*•]\\s+/,""))+"</li>";
continue;
}
const numbered=line.match(/^(\\d+)[.)]\\s+(.+)$/);
if(numbered){
closeParagraph();
if(inUL){html+="</ul>";inUL=false}
if(!inOL){html+='<ol start="'+Number(numbered[1])+'">';inOL=true}
html+="<li>"+parseInline(numbered[2])+"</li>";
continue;
}
if(/^>\\s?/.test(line)){closeParagraph();closeLists();html+="<blockquote>"+parseInline(line.replace(/^>\\s?/,""))+"</blockquote>";continue}
if(/^\\|.*\\|$/.test(line)&&i+1<lines.length&&/^\\|?\\s*:?-+:?\\s*(\\|\\s*:?-+:?\\s*)+\\|?$/.test(lines[i+1])){
closeParagraph();closeLists();
const header=line.split("|").slice(1,-1).map(x=>x.trim());
i++;
let rows=[];
while(i+1<lines.length&&/^\\|.*\\|$/.test(lines[i+1])&&!/^\\|?\\s*:?-+:?\\s*(\\|\\s*:?-+:?\\s*)+\\|?$/.test(lines[i+1])){i++;rows.push(lines[i].split("|").slice(1,-1).map(x=>x.trim()))}
html+='<div class="table-wrap"><table><thead><tr>'+header.map(x=>"<th>"+parseInline(x)+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(x=>"<td>"+parseInline(x)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>';
continue;
}
closeLists();paragraph.push(line.trim());
}
closeParagraph();closeLists();closeCode();
return html;
}

function addMessage(role,text){
const wrapper=document.createElement("div");
wrapper.className="message "+role;
const avatar=document.createElement("div");
avatar.className="avatar";avatar.textContent=role==="user"?"R":"AI";
const bubble=document.createElement("div");
bubble.className="bubble";
bubble.innerHTML=role==="assistant"?renderMarkdown(text):escapeHTML(text).replace(/\\n/g,"<br>");
if(role==="user"){wrapper.appendChild(bubble);wrapper.appendChild(avatar)}
else{wrapper.appendChild(avatar);wrapper.appendChild(bubble)}
chatInner.appendChild(wrapper);
chat.scrollTop=chat.scrollHeight;
}
function showWelcome(){
chatInner.innerHTML=`<div class="welcome"><h1>Rojak AI</h1><p>Asisten untuk Rojak DriveK1t dan kebutuhan rumus Excel.</p>
<div class="suggestions">
<button class="suggestion">Cara menggunakan Rojak DriveK1t</button>
<button class="suggestion">Cara menyimpan rumus Excel</button>
<button class="suggestion">Setelah membuat file, apa yang dilakukan?</button>
<button class="suggestion">Cara memasukkan rumus ke Excel</button>
</div></div>`;
document.querySelectorAll(".suggestion").forEach(b=>b.onclick=()=>{input.value=b.textContent;sendMessage()});
}
function saveHistory(){
localStorage.setItem("rojak_ai_history",JSON.stringify(chatHistory.slice(-30)));
}
function renderHistory(){
historyEl.innerHTML="";
chatHistory.slice().reverse().forEach((item,index)=>{
const el=document.createElement("div");el.className="history-item";el.textContent=item.title||"Chat baru";
el.onclick=()=>loadHistory(chatHistory.length-1-index);
historyEl.appendChild(el);
});
}
function loadHistory(index){
const item=chatHistory[index];if(!item)return;
messages=item.messages||[];
chatInner.innerHTML="";
messages.forEach(m=>addMessage(m.role,m.content));
sidebar.classList.remove("open");
}
function newChat(){
messages=[];showWelcome();input.value="";input.focus();
}
async function sendMessage(){
const text=input.value.trim();if(!text||send.disabled)return;
if(messages.length===0)chatInner.innerHTML="";
messages.push({role:"user",content:text});addMessage("user",text);
input.value="";input.style.height="auto";send.disabled=true;
const loading=document.createElement("div");loading.className="message assistant";loading.id="loading";
loading.innerHTML='<div class="avatar">AI</div><div class="bubble"><p>Menyiapkan jawaban...</p></div>';
chatInner.appendChild(loading);chat.scrollTop=chat.scrollHeight;
try{
const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});
const data=await res.json();
if(!res.ok)throw new Error(data.error||"Gagal menghubungi server.");
const answer=cleanAIText(data.reply||"Tidak ada jawaban.");
messages.push({role:"assistant",content:answer});
document.getElementById("loading")?.remove();addMessage("assistant",answer);
if(messages.length===2){chatHistory.push({title:text.slice(0,60),messages:[...messages]});saveHistory();renderHistory()}
}catch(err){
document.getElementById("loading")?.remove();
addMessage("assistant","Terjadi masalah saat menghubungi Rojak AI.\n\n"+err.message);
}finally{send.disabled=false;input.focus()}
}
form.addEventListener("submit",e=>{e.preventDefault();sendMessage()});
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,150)+"px"});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});
document.addEventListener("click",e=>{
if(e.target.classList.contains("copy-code")){
const code=e.target.dataset.code;
navigator.clipboard.writeText(code).then(()=>{e.target.textContent="Copied";setTimeout(()=>e.target.textContent="Copy",1200)});
}
});
document.getElementById("newChat").onclick=newChat;
document.getElementById("mobileMenu").onclick=()=>sidebar.classList.toggle("open");
showWelcome();renderHistory();
</script>
</body>
</html>
