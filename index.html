<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rojak AI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0d0d0d;
      --panel: #151515;
      --panel-2: #1b1b1b;
      --border: #292929;
      --text: #f5f5f5;
      --muted: #929292;
      --accent: #ff6a00;
      --accent-hover: #ff7d24;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       APP
    ========================= */

    .app {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 250px;
      height: 100%;
      background: #111;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #fff;
      font-size: 15px;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
    }

    .brand-status {
      font-size: 11px;
      color: #777;
      margin-top: 2px;
    }

    .new-chat {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border);
      background: #191919;
      color: #fff;
      border-radius: 9px;
      text-align: left;
      padding: 0 13px;
      transition: .2s;
    }

    .new-chat:hover {
      background: #222;
      border-color: #3a3a3a;
    }

    .history-title {
      margin-top: 25px;
      margin-bottom: 9px;
      color: #777;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    .history {
      flex: 1;
      overflow-y: auto;
    }

    .history-item {
      width: 100%;
      padding: 10px;
      border-radius: 7px;
      border: 0;
      background: transparent;
      color: #cfcfcf;
      text-align: left;
      margin-bottom: 3px;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item:hover {
      background: #1c1c1c;
    }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 10px;
      color: #666;
      font-size: 11px;
      line-height: 1.5;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 60px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
    }

    .mobile-menu {
      display: none;
      width: 35px;
      height: 35px;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 20px;
    }

    .model-name {
      font-size: 13px;
      color: #aaa;
    }

    .model-name strong {
      color: #fff;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #888;
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #46c56f;
      border-radius: 50%;
    }

    /* =========================
       CHAT
    ========================= */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 35px 20px 160px;
    }

    .chat-inner {
      width: min(850px, 100%);
      margin: auto;
    }

    .welcome {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }

    .welcome-logo {
      width: 58px;
      height: 58px;
      background: var(--accent);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .welcome h1 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 14px;
      max-width: 470px;
      line-height: 1.6;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      width: min(620px, 100%);
      margin-top: 25px;
    }

    .suggestion {
      background: #151515;
      border: 1px solid var(--border);
      color: #cfcfcf;
      border-radius: 9px;
      padding: 13px;
      text-align: left;
      font-size: 13px;
      transition: .2s;
    }

    .suggestion:hover {
      background: #1c1c1c;
      border-color: #3a3a3a;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      display: flex;
      gap: 13px;
      margin-bottom: 28px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }

    .user-avatar {
      background: #292929;
      color: #ddd;
    }

    .ai-avatar {
      background: var(--accent);
      color: #fff;
    }

    .message-body {
      min-width: 0;
      flex: 1;
    }

    .message-name {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 7px;
      color: #ddd;
    }

    .message-content {
      color: #ddd;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-content code {
      background: #202020;
      padding: 2px 5px;
      border-radius: 4px;
      font-family: monospace;
    }

    /* =========================
       INPUT
    ========================= */

    .input-area {
      position: fixed;
      bottom: 0;
      left: 250px;
      right: 0;
      padding: 15px 20px 20px;
      background: linear-gradient(
        to top,
        #0d0d0d 70%,
        rgba(13,13,13,0)
      );
      z-index: 10;
    }

    .input-container {
      width: min(850px, 100%);
      margin: auto;
      background: #151515;
      border: 1px solid #303030;
      border-radius: 13px;
      display: flex;
      align-items: flex-end;
      padding: 8px;
    }

    #messageInput {
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      padding: 9px 10px;
      min-height: 38px;
      max-height: 150px;
      line-height: 1.5;
    }

    #messageInput::placeholder {
      color: #666;
    }

    .send-button {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 17px;
      flex-shrink: 0;
      transition: .2s;
    }

    .send-button:hover {
      background: var(--accent-hover);
    }

    .send-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .input-info {
      width: min(850px, 100%);
      margin: 7px auto 0;
      text-align: center;
      color: #555;
      font-size: 10px;
    }

    /* =========================
       TYPING
    ========================= */

    .typing {
      display: flex;
      gap: 4px;
      padding: 5px 0;
    }

    .typing span {
      width: 5px;
      height: 5px;
      background: #777;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes blink {
      0%, 60%, 100% {
        opacity: .3;
      }

      30% {
        opacity: 1;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .sidebar {
        position: fixed;
        left: -260px;
        top: 0;
        bottom: 0;
        z-index: 50;
        transition: left .2s ease;
      }

      .sidebar.open {
        left: 0;
      }

      .mobile-menu {
        display: block;
      }

      .topbar {
        padding: 0 12px;
      }

      .input-area {
        left: 0;
        padding: 10px 10px 13px;
      }

      .chat {
        padding: 25px 13px 140px;
      }

      .welcome {
        min-height: 65vh;
      }

      .welcome h1 {
        font-size: 23px;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .message {
        gap: 9px;
      }

      .avatar {
        width: 29px;
        height: 29px;
        flex-basis: 29px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-logo">R</div>

      <div>
        <div class="brand-name">Rojak AI</div>
        <div class="brand-status">AI Assistant</div>
      </div>
    </div>

    <button class="new-chat" id="newChat">
      + &nbsp; Chat Baru
    </button>

    <div class="history-title">
      Riwayat
    </div>

    <div class="history" id="history"></div>

    <div class="sidebar-footer">
      Rojak AI<br>
      Powered by OpenRouter
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">

      <button
        class="mobile-menu"
        id="mobileMenu"
        aria-label="Menu"
      >
        ☰
      </button>

      <div class="model-name">
        <strong>Rojak AI</strong>
        &nbsp;·&nbsp; OpenRouter
      </div>

      <div class="status">
        <span class="status-dot"></span>
        Online
      </div>

    </header>

    <!-- CHAT -->
    <section class="chat" id="chat">

      <div class="chat-inner" id="chatInner">

        <div class="welcome" id="welcome">

          <div class="welcome-logo">
            R
          </div>

          <h1>Halo, saya Rojak AI</h1>

          <p>
            Asisten AI untuk membantu coding,
            tugas sekolah, ide, dan berbagai kebutuhanmu.
          </p>

          <div class="suggestions">

            <button class="suggestion">
              Jelaskan HTML untuk pemula
            </button>

            <button class="suggestion">
              Buatkan website sederhana
            </button>

            <button class="suggestion">
              Bantu saya belajar matematika
            </button>

            <button class="suggestion">
              Berikan ide project coding
            </button>

          </div>

        </div>

      </div>

    </section>

    <!-- INPUT -->
    <div class="input-area">

      <div class="input-container">

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Tulis pesan..."
          autocomplete="off"
        ></textarea>

        <button
          class="send-button"
          id="sendButton"
          aria-label="Kirim"
        >
          ↑
        </button>

      </div>

      <div class="input-info">
        Rojak AI dapat membuat kesalahan. Periksa informasi penting.
      </div>

    </div>

  </main>

</div>

<script>
  const chat = document.getElementById("chat");
  const chatInner = document.getElementById("chatInner");
  const welcome = document.getElementById("welcome");
  const input = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");
  const newChat = document.getElementById("newChat");
  const history = document.getElementById("history");
  const sidebar = document.getElementById("sidebar");
  const mobileMenu = document.getElementById("mobileMenu");

  let messages = [];
  let isLoading = false;

  /* =========================
     LOCAL STORAGE
  ========================= */

  function saveHistory() {
    localStorage.setItem(
      "rojak_ai_history",
      JSON.stringify(messages)
    );
  }

  function loadHistory() {
    try {
      const saved = localStorage.getItem("rojak_ai_history");

      if (!saved) return;

      const parsed = JSON.parse(saved);

      if (Array.isArray(parsed)) {
        messages = parsed;
        renderMessages();
        renderHistory();
      }
    } catch (error) {
      console.error(error);
    }
  }

  /* =========================
     HISTORY
  ========================= */

  function renderHistory() {
    history.innerHTML = "";

    const userMessages = messages.filter(
      message => message.role === "user"
    );

    userMessages.forEach((message) => {

      const button = document.createElement("button");

      button.className = "history-item";

      button.textContent =
        message.content.substring(0, 35);

      button.onclick = () => {
        chat.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      };

      history.appendChild(button);
    });
  }

  /* =========================
     RENDER
  ========================= */

  function renderMessages() {

    chatInner.innerHTML = "";

    if (messages.length === 0) {
      chatInner.appendChild(welcome);
      return;
    }

    messages.forEach(message => {
      addMessageToUI(
        message.role,
        message.content
      );
    });

    scrollBottom();
  }

  function addMessageToUI(role, content) {

    const message = document.createElement("div");

    message.className = "message";

    const avatar = document.createElement("div");

    avatar.className =
      "avatar " +
      (role === "user"
        ? "user-avatar"
        : "ai-avatar");

    avatar.textContent =
      role === "user" ? "K" : "R";

    const body = document.createElement("div");

    body.className = "message-body";

    const name = document.createElement("div");

    name.className = "message-name";

    name.textContent =
      role === "user"
        ? "Kamu"
        : "Rojak AI";

    const contentElement = document.createElement("div");

    contentElement.className = "message-content";

    contentElement.textContent = content;

    body.appendChild(name);
    body.appendChild(contentElement);

    message.appendChild(avatar);
    message.appendChild(body);

    chatInner.appendChild(message);
  }

  /* =========================
     SEND
  ========================= */

  async function sendMessage(text) {

    if (isLoading) return;

    text = text.trim();

    if (!text) return;

    if (messages.length === 0) {
      chatInner.innerHTML = "";
    }

    messages.push({
      role: "user",
      content: text
    });

    addMessageToUI("user", text);

    saveHistory();
    renderHistory();

    input.value = "";
    autoResize();

    isLoading = true;
    sendButton.disabled = true;

    const loadingMessage = document.createElement("div");

    loadingMessage.className = "message";

    loadingMessage.innerHTML = `
      <div class="avatar ai-avatar">R</div>

      <div class="message-body">
        <div class="message-name">Rojak AI</div>

        <div class="typing">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    `;

    chatInner.appendChild(loadingMessage);

    scrollBottom();

    try {

      const response = await fetch("/api/chat", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          messages: messages
        })
      });

      const data = await response.json();

      loadingMessage.remove();

      if (!response.ok) {
        throw new Error(
          data.error ||
          "Terjadi kesalahan pada server."
        );
      }

      const answer =
        data.answer ||
        "Maaf, AI tidak memberikan jawaban.";

      messages.push({
        role: "assistant",
        content: answer
      });

      addMessageToUI(
        "assistant",
        answer
      );

      saveHistory();
      renderHistory();

    } catch (error) {

      loadingMessage.remove();

      const errorText =
        "Maaf, terjadi kesalahan.\n\n" +
        error.message;

      addMessageToUI(
        "assistant",
        errorText
      );

    } finally {

      isLoading = false;
      sendButton.disabled = false;

      input.focus();

      scrollBottom();
    }
  }

  /* =========================
     SCROLL
  ========================= */

  function scrollBottom() {
    setTimeout(() => {
      chat.scrollTo({
        top: chat.scrollHeight,
        behavior: "smooth"
      });
    }, 50);
  }

  /* =========================
     TEXTAREA
  ========================= */

  function autoResize() {

    input.style.height = "auto";

    input.style.height =
      Math.min(input.scrollHeight, 150) + "px";
  }

  input.addEventListener(
    "input",
    autoResize
  );

  input.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();
        sendMessage(input.value);
      }

    }
  );

  sendButton.addEventListener(
    "click",
    () => sendMessage(input.value)
  );

  /* =========================
     SUGGESTIONS
  ========================= */

  document.querySelectorAll(".suggestion")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          input.value =
            button.textContent.trim();

          autoResize();
          input.focus();

        }
      );

    });

  /* =========================
     NEW CHAT
  ========================= */

  newChat.addEventListener(
    "click",
    () => {

      messages = [];

      localStorage.removeItem(
        "rojak_ai_history"
      );

      renderMessages();
      renderHistory();

      input.value = "";
      autoResize();
      input.focus();

      sidebar.classList.remove("open");

    }
  );

  /* =========================
     MOBILE MENU
  ========================= */

  mobileMenu.addEventListener(
    "click",
    () => {
      sidebar.classList.toggle("open");
    }
  );

  /* =========================
     START
  ========================= */

  loadHistory();
</script>

</body>
</html>
