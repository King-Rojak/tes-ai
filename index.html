<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rojak AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0f12;--panel:#15181c;--panel2:#1b1f24;--line:#292e35;--text:#f1f3f5;--muted:#969da7;--accent:#ff7a00}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.app{display:flex;height:100vh}
.sidebar{width:255px;flex:none;background:#111317;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
.brand{padding:4px 10px 18px}.brand strong{font-size:18px}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.new-chat{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:11px 13px;text-align:left;cursor:pointer;font-size:14px}
.history{margin-top:18px;color:var(--muted);font-size:12px;padding:0 10px}.history-item{margin-top:10px;color:#c9ced5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{min-width:0;flex:1;display:flex;flex-direction:column}
.topbar{height:58px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#101216}
.title{font-size:14px;font-weight:600}.status{font-size:12px;color:#8f969f}.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#4caf50;margin-right:7px}
.chat{flex:1;overflow-y:auto;padding:32px 20px 120px}
.chat-inner{max-width:820px;margin:0 auto}
.welcome{text-align:center;padding:12vh 20px 0}.logo{width:52px;height:52px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 16px;font-weight:800;font-size:21px}.welcome h1{font-size:28px}.welcome p{color:var(--muted);margin:10px auto 24px;max-width:550px;line-height:1.6}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;max-width:620px;margin:auto}.suggestion{background:var(--panel);border:1px solid var(--line);color:#dfe3e7;border-radius:9px;padding:12px;text-align:left;cursor:pointer}.suggestion:hover{border-color:#3b424b}
.message{display:flex;margin:0 0 24px}.message.user{justify-content:flex-end}.bubble{max-width:82%;line-height:1.65;font-size:15px}.user .bubble{background:#20252b;border:1px solid #2c3239;border-radius:14px;padding:11px 14px}.assistant .bubble{width:100%}
.message.assistant{display:block}
.bubble h1,.bubble h2,.bubble h3{line-height:1.3;margin:18px 0 9px}.bubble h1{font-size:21px}.bubble h2{font-size:18px}.bubble h3{font-size:16px}.bubble p{margin:7px 0}.bubble strong{font-weight:700;color:#fff}.bubble em{font-style:italic}
.bubble ol,.bubble ul{margin:8px 0 10px 25px}.bubble li{margin:5px 0;padding-left:2px}.bubble ol{padding-left:4px}.bubble ul{padding-left:4px}
.bubble blockquote{border-left:3px solid #555d66;padding-left:12px;color:#c0c5cb;margin:10px 0}
.bubble hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.inline-code{background:#20252b;border:1px solid #30363e;border-radius:5px;padding:2px 5px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em}
.code-wrap{margin:12px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0a0c0f;max-width:100%}
.code-head{height:36px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 9px 0 12px;color:var(--muted);font-size:11px}
.copy-code{border:0;background:transparent;color:#cfd4da;cursor:pointer;padding:5px 7px;border-radius:5px}.copy-code:hover{background:#1c2127}
.code-wrap pre{margin:0;padding:13px;max-width:100%;overflow-x:auto;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.code-wrap code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.composer{position:fixed;left:255px;right:0;bottom:0;padding:16px 20px 20px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.composer-inner{max-width:820px;margin:auto;display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px}
textarea{flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:9px;font:inherit;max-height:150px}
.send{width:42px;height:42px;border:0;border-radius:8px;background:var(--accent);color:#111;font-weight:800;cursor:pointer}.send:disabled{opacity:.45;cursor:not-allowed}
.typing{color:var(--muted);font-size:13px}
@media(max-width:700px){
.sidebar{position:fixed;z-index:10;left:-270px;top:0;bottom:0;transition:.2s}.sidebar.open{left:0}.topbar{padding:0 14px}.chat{padding:24px 14px 115px}.composer{left:0;padding:12px}.bubble{max-width:92%}.suggestions{grid-template-columns:1fr}.welcome{padding-top:7vh}.welcome h1{font-size:24px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><strong>Rojak AI</strong><span>Asisten Rojak DriveK1t</span></div>
  <button class="new-chat" id="newChat">+ Chat Baru</button>
  <div class="history">Riwayat</div>
  <div id="historyList"></div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="title">Rojak AI · DriveK1t Assistant</div>
    <div class="status">Online</div>
  </header>
  <section class="chat" id="chat"><div class="chat-inner" id="chatInner"></div></section>
  <div class="composer">
    <form class="composer-inner" id="form">
      <textarea id="input" rows="1" placeholder="Tulis pertanyaan..."></textarea>
      <button class="send" id="send" type="submit">↑</button>
    </form>
  </div>
</main>
</div>
<script>
const input=document.getElementById("input"),form=document.getElementById("form"),send=document.getElementById("send"),chatInner=document.getElementById("chatInner"),chat=document.getElementById("chat"),newChat=document.getElementById("newChat");
let messages=[];

function escapeHTML(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function cleanAIText(text){
 return String(text||"").replace(/[\\u200B-\\u200D\\uFEFF]/g,"").replace(/[\\u{1F300}-\\u{1FAFF}\\u{2600}-\\u{27BF}]/gu,"").replace(/\\r/g,"").trim();
}
function inline(s){
 s=escapeHTML(s);
 s=s.replace(/`([^`\\n]+)`/g,'<code class="inline-code">$1</code>');
 s=s.replace(/\\*\\*([^*\\n]+)\\*\\*/g,"<strong>$1</strong>");
 s=s.replace(/__([^_\\n]+)__/g,"<strong>$1</strong>");
 s=s.replace(/\\*([^*\\n]+)\\*/g,"<em>$1</em>");
 s=s.replace(/_([^_\\n]+)_/g,"<em>$1</em>");
 return s;
}
function renderMarkdown(raw){
 const text=cleanAIText(raw);
 const lines=text.split("\\n"), out=[];
 let i=0, orderedOpen=false, unorderedOpen=false, orderedCount=0;
 const closeLists=()=>{if(orderedOpen){out.push("</ol>");orderedOpen=false}if(unorderedOpen){out.push("</ul>");unorderedOpen=false}};
 while(i<lines.length){
   let line=lines[i];
   if(/^```/.test(line.trim())){
     closeLists();
     const lang=line.trim().slice(3).trim()||"text"; const code=[];
     i++;
     while(i<lines.length&&!/^```/.test(lines[i].trim())){code.push(lines[i]);i++}
     if(i<lines.length)i++;
     const safe=escapeHTML(code.join("\\n"));
     const id="code_"+Math.random().toString(36).slice(2);
     out.push(`<div class="code-wrap"><div class="code-head"><span>${escapeHTML(lang)}</span><button class="copy-code" data-code="${encodeURIComponent(code.join("\\n"))}">Copy</button></div><pre><code id="${id}">${safe}</code></pre></div>`);
     continue;
   }
   if(/^#{1,3}\\s+/.test(line)){closeLists();const m=line.match(/^(#{1,3})\\s+(.*)$/);out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);i++;continue}
   if(/^\\s*(---+|___+|\\*\\*\\*+)\\s*$/.test(line)){closeLists();out.push("<hr>");i++;continue}
   if(/^\\s*>/.test(line)){closeLists();out.push(`<blockquote>${inline(line.replace(/^\\s*>\\s?/,""))}</blockquote>`);i++;continue}

   const num=line.match(/^\\s*(\\d+)[.)]\\s+(.*)$/);
   if(num){
     if(unorderedOpen){out.push("</ul>");unorderedOpen=false}
     if(!orderedOpen){orderedOpen=true;out.push(`<ol start="${Math.max(1,parseInt(num[1],10))}">`);orderedCount=parseInt(num[1],10)-1}
     orderedCount++;
     // Keep displayed numbering continuous even if the AI accidentally restarts at 1.
     out.push(`<li>${inline(num[2])}</li>`);
     i++; continue;
   }
   const bullet=line.match(/^\\s*[-*+]\\s+(.*)$/);
   if(bullet){
     if(orderedOpen){out.push("</ol>");orderedOpen=false}
     if(!unorderedOpen){unorderedOpen=true;out.push("<ul>")}
     out.push(`<li>${inline(bullet[1])}</li>`);
     i++; continue;
   }
   if(!line.trim()){i++;continue}
   closeLists();
   let para=[line.trim()]; i++;
   while(i<lines.length && lines[i].trim() && !/^(#{1,3})\\s+/.test(lines[i]) && !/^\\s*[-*+]\\s+/.test(lines[i]) && !/^\\s*\\d+[.)]\\s+/.test(lines[i]) && !/^\\s*>/.test(lines[i]) && !/^```/.test(lines[i].trim())){para.push(lines[i].trim());i++}
   out.push(`<p>${inline(para.join(" "))}</p>`);
 }
 closeLists();
 return out.join("");
}
function addMessage(role,content){
 const wrap=document.createElement("div");wrap.className="message "+role;
 const bubble=document.createElement("div");bubble.className="bubble";
 bubble.innerHTML=role==="assistant"?renderMarkdown(content):inline(content).replace(/\\n/g,"<br>");
 wrap.appendChild(bubble);chatInner.appendChild(wrap);
 chat.scrollTop=chat.scrollHeight;
 return bubble;
}
function welcome(){
 chatInner.innerHTML=`<div class="welcome"><div class="logo">R</div><h1>Rojak AI</h1><p>Asisten untuk membantu menggunakan Rojak DriveK1t dan mengerjakan rumus Excel.</p><div class="suggestions">
 <button class="suggestion">Cara menggunakan Rojak DriveK1t?</button>
 <button class="suggestion">Buatkan rumus Excel untuk saya</button>
 <button class="suggestion">Bagaimana cara menyimpan rumus?</button>
 <button class="suggestion">Jelaskan langkah menggunakan file rumus</button>
 </div></div>`;
 document.querySelectorAll(".suggestion").forEach(b=>b.onclick=()=>{input.value=b.textContent;sendMessage()});
}
async function sendMessage(){
 const text=input.value.trim();if(!text||send.disabled)return;
 if(chatInner.querySelector(".welcome"))chatInner.innerHTML="";
 messages.push({role:"user",content:text});addMessage("user",text);input.value="";input.style.height="auto";send.disabled=true;
 const typing=addMessage("assistant","Mengetik...");
 typing.className="bubble typing";
 try{
   const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});
   const data=await r.json(); if(!r.ok)throw new Error(data.error||"Request gagal");
   typing.className="bubble";typing.innerHTML=renderMarkdown(data.answer||"Tidak ada jawaban.");
   messages.push({role:"assistant",content:data.answer||""});
   chat.scrollTop=chat.scrollHeight;
 }catch(e){typing.className="bubble";typing.textContent="Terjadi kesalahan: "+e.message}
 finally{send.disabled=false;input.focus()}
}
form.addEventListener("submit",e=>{e.preventDefault();sendMessage()});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,150)+"px"});
document.addEventListener("click",async e=>{
 if(e.target.classList.contains("copy-code")){const code=decodeURIComponent(e.target.dataset.code);try{await navigator.clipboard.writeText(code);e.target.textContent="Copied";setTimeout(()=>e.target.textContent="Copy",1200)}catch{}}
});
newChat.onclick=()=>{messages=[];welcome()};
welcome();
</script>
</body>
</html>
